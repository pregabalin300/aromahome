server {
    listen 80;
    server_name aromahome.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name aromahome.localhost;

    ssl_certificate     /etc/nginx/certs/aromahome.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/aromahome.localhost-key.pem;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://app:3000; # app - это имя сервиса в docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}