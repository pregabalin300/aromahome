<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AromaHome — Каталог свечей</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">AromaHome</a>
            <nav>
                <a href="catalog.html">Каталог</a>
                <a href="about.html">О магазине</a>
                <a href="delivery.html">Доставка</a>
                <a href="contacts.html">Контакты</a>
            </nav>
            <div class="header-actions">
                <input type="text" class="search-input" placeholder="Поиск свечи">
                <button class="icon-btn">♡</button>
                <button class="icon-btn">▢</button>
                <a href="login.html" class="login-btn">Войти</a>
            </div>
        </div>
    </header>

    <section>
        <div class="container">
            <div class="section-label">Коллекция</div>
            <h1 class="section-title">Каталог свечей</h1>
            <p class="section-subtitle">Выберите аромат, воск и формат для своего пространства.</p>

            <div class="catalog-layout">
                <!-- Фильтры -->
                <aside class="filters">
                    <h3>Фильтры</h3>

                    <div class="filter-group">
                        <div class="filter-title">Аромат</div>
                        <label><input type="checkbox"> Лаванда</label>
                        <label><input type="checkbox"> Ваниль</label>
                        <label><input type="checkbox"> Цитрус</label>
                        <label><input type="checkbox"> Хвоя</label>
                        <label><input type="checkbox"> Кофе</label>
                    </div>

                    <div class="filter-group">
                        <div class="filter-title">Тип воска</div>
                        <label><input type="checkbox"> Соевый</label>
                        <label><input type="checkbox"> Кокосовый</label>
                        <label><input type="checkbox"> Пчелиный</label>
                    </div>

                    <div class="filter-group">
                        <div class="filter-title">Цена</div>
                        <input type="range" min="800" max="3500" value="3500" class="price-range">
                    <div class="price-labels">
                        <span>800 ₽</span>
                        <span id="price-value">3 500 ₽</span>
                    </div>
                    </div>
                </aside>

                <!-- Товары -->
                <div class="catalog-content">
                    <div class="catalog-top">
                        <span id="product-count">6 товаров</span>
                    <select class="sort-select" id="sort-select">
                        <option value="popular">Сначала популярные</option>
                        <option value="cheap">Сначала дешевые</option>
                        <option value="expensive">Сначала дорогие</option>
                    </select>
                    </div>

                    <div class="products-grid catalog-grid" id="products"></div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div>
                <div class="footer-logo">AromaHome</div>
                <div class="footer-copy">Аромат, который остается с вами</div>
            </div>
            <div class="footer-links">
                <a href="catalog.html">Каталог</a>
                <a href="about.html">О магазине</a>
                <a href="delivery.html">Доставка</a>
                <a href="contacts.html">Контакты</a>
            </div>
            <div class="footer-copy">© 2026 AromaHome</div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
