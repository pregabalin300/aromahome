<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AromaHome — Каталог</title>
    <link rel="stylesheet" href="css/output.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-[#FAF7F2] text-[#3E2C23] antialiased">

    <!-- Шапка -->
    <header class="bg-white border-b border-[#EFE9E0] py-5">
        <div class="max-w-[1160px] mx-auto px-5 flex items-center justify-between gap-10">
            <a href="index.html" class="font-serif text-2xl text-[#3E2C23] no-underline tracking-wide">AromaHome</a>
            <nav class="flex gap-8 flex-1">
                <a href="catalog.html" class="text-[#6B5B4F] text-sm no-underline hover:text-[#C97B5A] transition-colors">Каталог</a>
                <a href="about.html" class="text-[#6B5B4F] text-sm no-underline hover:text-[#C97B5A] transition-colors">О магазине</a>
                <a href="delivery.html" class="text-[#6B5B4F] text-sm no-underline hover:text-[#C97B5A] transition-colors">Доставка</a>
                <a href="contacts.html" class="text-[#6B5B4F] text-sm no-underline hover:text-[#C97B5A] transition-colors">Контакты</a>
            </nav>
            <div class="flex items-center gap-5">
                <input type="text" placeholder="Поиск свечи" class="px-4 py-2 border border-[#E0D5C5] rounded-full text-[13px] w-[220px] bg-white outline-none placeholder:text-[#B5A99A] focus:border-[#C97B5A] transition-colors">
                <a href="account.html" class="text-[#6B5B4F] hover:text-[#C97B5A] p-1.5 rounded-md transition-colors" title="Избранное">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                </a>
                <a href="cart.html" class="text-[#6B5B4F] hover:text-[#C97B5A] p-1.5 rounded-md transition-colors" title="Корзина">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                </a>
                <a href="login.html" class="text-[#3E2C23] text-sm no-underline">Войти</a>
            </div>
        </div>
    </header>

    <!-- Контент -->
    <section class="py-[60px]">
        <div class="max-w-[1160px] mx-auto px-5">
            <div class="text-[11px] tracking-[1.5px] text-[#C97B5A] uppercase mb-3">Коллекция</div>
            <h1 class="font-serif text-[36px] text-[#3E2C23] mb-3 font-normal">Каталог свечей</h1>
            <p class="text-sm text-[#6B5B4F] mb-10">Выберите аромат, воск и формат для своего пространства.</p>

            <div class="grid grid-cols-[240px_1fr] gap-10 mt-[30px]">
                
                <!-- Фильтры -->
                <aside class="bg-white p-6 rounded-[10px] border border-[#EFE9E0] h-fit">
                    <h3 class="text-sm tracking-widest uppercase mb-5 text-[#3E2C23]">Фильтры</h3>

                    <div class="mb-6">
                        <div class="text-xs tracking-widest uppercase text-[#9B8B7A] mb-3">Аромат</div>
                        <label class="block text-sm text-[#6B5B4F] mb-2 cursor-pointer"><input type="checkbox" class="mr-2 accent-[#C97B5A]"> Лаванда</label>
                        <label class="block text-sm text-[#6B5B4F] mb-2 cursor-pointer"><input type="checkbox" class="mr-2 accent-[#C97B5A]"> Ваниль</label>
                        <label class="block text-sm text-[#6B5B4F] mb-2 cursor-pointer"><input type="checkbox" class="mr-2 accent-[#C97B5A]"> Цитрус</label>
                        <label class="block text-sm text-[#6B5B4F] mb-2 cursor-pointer"><input type="checkbox" class="mr-2 accent-[#C97B5A]"> Хвоя</label>
                        <label class="block text-sm text-[#6B5B4F] mb-2 cursor-pointer"><input type="checkbox" class="mr-2 accent-[#C97B5A]"> Кофе</label>
                    </div>

                    <div class="mb-6">
                        <div class="text-xs tracking-widest uppercase text-[#9B8B7A] mb-3">Тип воска</div>
                        <label class="block text-sm text-[#6B5B4F] mb-2 cursor-pointer"><input type="checkbox" class="mr-2 accent-[#C97B5A]"> Соевый</label>
                        <label class="block text-sm text-[#6B5B4F] mb-2 cursor-pointer"><input type="checkbox" class="mr-2 accent-[#C97B5A]"> Кокосовый</label>
                        <label class="block text-sm text-[#6B5B4F] mb-2 cursor-pointer"><input type="checkbox" class="mr-2 accent-[#C97B5A]"> Пчелиный</label>
                    </div>

                    <div>
                        <div class="text-xs tracking-widest uppercase text-[#9B8B7A] mb-3">Цена</div>
                        <input type="range" min="800" max="3500" value="3500" class="w-full accent-[#C97B5A] price-range">
                        <div class="flex justify-between text-xs text-[#9B8B7A] mt-1.5">
                        <span>800 ₽</span>
                        <span id="price-value">3 500 ₽</span>
                    </div>
                </div>
                </aside>

                <!-- Товары -->
                <div>
                    <div class="flex justify-between items-center mb-6 text-[13px] text-[#6B5B4F]">
                        <span id="product-count">6 товаров</span>
                        <select id="sort-select" class="px-3 py-2 border border-[#E0D5C5] rounded-md bg-white text-[13px] text-[#3E2C23] outline-none cursor-pointer">
                            <option value="popular">Сначала популярные</option>
                            <option value="cheap">Сначала дешевые</option>
                            <option value="expensive">Сначала дорогие</option>
                        </select>
                    </div>

                    <!-- Сетка товаров -->
                    <div class="grid grid-cols-3 gap-6 catalog-grid" id="products"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Подвал -->
    <footer class="bg-white py-10 border-t border-[#EFE9E0] mt-[60px]">
        <div class="max-w-[1160px] mx-auto px-5 flex justify-between items-center flex-wrap gap-5">
            <div>
                <div class="font-serif text-xl text-[#3E2C23]">AromaHome</div>
                <div class="text-xs text-[#B5A99A]">Аромат, который остается с вами</div>
            </div>
            <div class="flex gap-6 text-[13px] text-[#6B5B4F]">
                <a href="catalog.html" class="hover:text-[#C97B5A] transition-colors">Каталог</a>
                <a href="about.html" class="hover:text-[#C97B5A] transition-colors">О магазине</a>
                <a href="delivery.html" class="hover:text-[#C97B5A] transition-colors">Доставка</a>
                <a href="contacts.html" class="hover:text-[#C97B5A] transition-colors">Контакты</a>
            </div>
            <div class="text-xs text-[#B5A99A]">© 2026 AromaHome</div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
