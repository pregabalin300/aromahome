<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AromaHome — Оформление заказа</title>
    <link rel="stylesheet" href="css/output.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-[#FAF7F2] text-[#3E2C23] antialiased">

    <header class="bg-white border-b border-[#EFE9E0] py-5">
        <div class="max-w-[1160px] mx-auto px-5 flex items-center justify-between gap-10">
            <a href="index.html" class="font-serif text-2xl text-[#3E2C23] no-underline tracking-wide">AromaHome</a>
            <nav class="flex gap-8 flex-1">
                <a href="catalog.html" class="text-[#6B5B4F] text-sm no-underline hover:text-[#C97B5A] transition-colors">Каталог</a>
                <a href="about.html" class="text-[#6B5B4F] text-sm no-underline hover:text-[#C97B5A] transition-colors">О магазине</a>
                <a href="delivery.html" class="text-[#6B5B4F] text-sm no-underline hover:text-[#C97B5A] transition-colors">Доставка</a>
                <a href="contacts.html" class="text-[#6B5B4F] text-sm no-underline hover:text-[#C97B5A] transition-colors">Контакты</a>
            </nav>
            <div class="flex items-center gap-5">
                <input type="text" placeholder="Поиск свечи" class="px-4 py-2 border border-[#E0D5C5] rounded-full text-[13px] w-[220px] bg-white outline-none placeholder:text-[#B5A99A] focus:border-[#C97B5A] transition-colors">
                <a href="account.html" class="text-[#6B5B4F] hover:text-[#C97B5A] p-1.5 rounded-md transition-colors" title="Избранное">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                </a>
                <a href="cart.html" class="text-[#6B5B4F] hover:text-[#C97B5A] p-1.5 rounded-md transition-colors" title="Корзина">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                </a>
                <a href="login.html" class="text-[#3E2C23] text-sm no-underline login-link">Войти</a>
            </div>
        </div>
    </header>

    <section class="py-[60px]">
        <div class="max-w-[1160px] mx-auto px-5">
            <div class="text-[11px] tracking-[1.5px] text-[#C97B5A] uppercase mb-3">Финальный шаг</div>
            <h1 class="font-serif text-[36px] text-[#3E2C23] mb-3 font-normal">Оформление заказа</h1>
            <p class="text-sm text-[#6B5B4F] mb-10">Заполните данные получателя и выберите способ оплаты.</p>

            <div class="grid grid-cols-[1fr_400px] gap-10 mt-[40px]">
                
                <!-- Форма -->
                <form class="flex flex-col gap-5" id="checkout-form" onsubmit="submitOrder(event)">
                    <div class="flex flex-col">
                        <label class="text-[13px] text-[#6B5B4F] mb-1.5">Имя</label>
                        <input type="text" id="name" required placeholder="Ваше имя" class="px-4 py-3 border border-[#E0D5C5] rounded-md text-sm bg-white outline-none focus:border-[#C97B5A] text-[#3E2C23]">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-[13px] text-[#6B5B4F] mb-1.5">Телефон</label>
                        <input type="tel" id="phone" required placeholder="+7 900 000-00-00" class="px-4 py-3 border border-[#E0D5C5] rounded-md text-sm bg-white outline-none focus:border-[#C97B5A] text-[#3E2C23]">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-[13px] text-[#6B5B4F] mb-1.5">Email</label>
                        <input type="email" id="email" required placeholder="your@email.com" class="px-4 py-3 border border-[#E0D5C5] rounded-md text-sm bg-white outline-none focus:border-[#C97B5A] text-[#3E2C23]">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-[13px] text-[#6B5B4F] mb-1.5">Адрес</label>
                        <input type="text" id="address" required placeholder="Город, улица, дом, квартира" class="px-4 py-3 border border-[#E0D5C5] rounded-md text-sm bg-white outline-none focus:border-[#C97B5A] text-[#3E2C23]">
                    </div>

                    <div class="flex flex-col">
                        <label class="text-[13px] text-[#6B5B4F] mb-2.5">Доставка</label>
                        <div class="flex gap-5">
                            <label class="flex items-center gap-1.5 text-sm text-[#3E2C23] cursor-pointer"><input type="radio" name="delivery" value="Курьер" checked class="accent-[#C97B5A]"> Курьер</label>
                            <label class="flex items-center gap-1.5 text-sm text-[#3E2C23] cursor-pointer"><input type="radio" name="delivery" value="Самовывоз" class="accent-[#C97B5A]"> Самовывоз</label>
                        </div>
                    </div>

                    <div class="flex flex-col">
                        <label class="text-[13px] text-[#6B5B4F] mb-2.5">Оплата</label>
                        <div class="flex gap-5">
                            <label class="flex items-center gap-1.5 text-sm text-[#3E2C23] cursor-pointer"><input type="radio" name="payment" value="Карта" checked class="accent-[#C97B5A]"> Карта</label>
                            <label class="flex items-center gap-1.5 text-sm text-[#3E2C23] cursor-pointer"><input type="radio" name="payment" value="СБП" class="accent-[#C97B5A]"> СБП</label>
                            <label class="flex items-center gap-1.5 text-sm text-[#3E2C23] cursor-pointer"><input type="radio" name="payment" value="При получении" class="accent-[#C97B5A]"> При получении</label>
                        </div>
                    </div>

                    <div class="flex flex-col">
                        <label class="text-[13px] text-[#6B5B4F] mb-1.5">Комментарий</label>
                        <textarea id="comment" rows="3" placeholder="Пожелания к заказу" class="px-4 py-3 border border-[#E0D5C5] rounded-md text-sm bg-white outline-none focus:border-[#C97B5A] text-[#3E2C23] resize-y"></textarea>
                    </div>
                </form>

                <!-- Сводка -->
                <aside class="bg-white rounded-[10px] p-8 border border-[#EFE9E0] h-fit sticky top-5" id="checkout-summary">
                    <!-- Сюда JS вставит сводку -->
                </aside>
            </div>
        </div>
    </section>

    <footer class="bg-white py-10 border-t border-[#EFE9E0] mt-[60px]">
        <div class="max-w-[1160px] mx-auto px-5 flex justify-between items-center flex-wrap gap-5">
            <div>
                <div class="font-serif text-xl text-[#3E2C23]">AromaHome</div>
                <div class="text-xs text-[#B5A99A]">Аромат, который остается с вами</div>
            </div>
            <div class="flex gap-6 text-[13px] text-[#6B5B4F]">
                <a href="catalog.html" class="hover:text-[#C97B5A] transition-colors">Каталог</a>
                <a href="about.html" class="hover:text-[#C97B5A] transition-colors">О магазине</a>
                <a href="delivery.html" class="hover:text-[#C97B5A] transition-colors">Доставка</a>
                <a href="contacts.html" class="hover:text-[#C97B5A] transition-colors">Контакты</a>
            </div>
            <div class="text-xs text-[#B5A99A]">© 2026 AromaHome</div>
        </div>
    </footer>

    <script src="js/checkout.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
