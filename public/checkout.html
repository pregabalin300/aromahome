<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AromaHome — Оформление заказа</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">AromaHome</a>
            <nav>
                <a href="catalog.html">Каталог</a>
                <a href="about.html">О магазине</a>
                <a href="delivery.html">Доставка</a>
                <a href="contacts.html">Контакты</a>
            </nav>
            <div class="header-actions">
                <input type="text" class="search-input" placeholder="Поиск свечи">
                <a href="account.html" class="icon-btn" title="Избранное">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </a>
                <a href="cart.html" class="icon-btn" title="Корзина">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                </a>
                <a href="login.html" class="login-btn">Войти</a>
            </div>
        </div>
    </header>

    <section>
        <div class="container">
            <div class="section-label">Финальный шаг</div>
            <h1 class="section-title">Оформление заказа</h1>
            <p class="section-subtitle">Заполните данные получателя и выберите способ оплаты.</p>

            <div class="checkout-layout">
                <!-- Форма -->
                <form class="checkout-form" id="checkout-form" onsubmit="submitOrder(event)">
                    <div class="form-group">
                        <label>Имя</label>
                        <input type="text" id="name" required placeholder="Ваше имя">
                    </div>

                    <div class="form-group">
                        <label>Телефон</label>
                        <input type="tel" id="phone" required placeholder="+7 900 000-00-00">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required placeholder="your@email.com">
                    </div>

                    <div class="form-group">
                        <label>Адрес</label>
                        <input type="text" id="address" required placeholder="Город, улица, дом, квартира">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Доставка</label>
                        <div class="radio-group">
                            <label><input type="radio" name="delivery" value="Курьер" checked> Курьер</label>
                            <label><input type="radio" name="delivery" value="Самовывоз"> Самовывоз</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Оплата</label>
                        <div class="radio-group">
                            <label><input type="radio" name="payment" value="Карта" checked> Карта</label>
                            <label><input type="radio" name="payment" value="СБП"> СБП</label>
                            <label><input type="radio" name="payment" value="При получении"> При получении</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Комментарий</label>
                        <textarea id="comment" rows="3" placeholder="Пожелания к заказу"></textarea>
                    </div>
                </form>

                <!-- Сводка заказа -->
                <aside class="checkout-summary" id="checkout-summary">
                    <!-- Сюда JS вставит сводку -->
                </aside>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div>
                <div class="footer-logo">AromaHome</div>
                <div class="footer-copy">Аромат, который остается с вами</div>
            </div>
            <div class="footer-links">
                <a href="catalog.html">Каталог</a>
                <a href="about.html">О магазине</a>
                <a href="delivery.html">Доставка</a>
                <a href="contacts.html">Контакты</a>
            </div>
            <div class="footer-copy">© 2026 AromaHome</div>
        </div>
    </footer>

    <script src="js/checkout.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
